algorithm: PPO
author: ''
description: Safety-focused racing with collision avoidance
environment:
  collision_penalty: -50.0
  control_input:
  - speed
  - steering_angle
  integrator: rk4
  map_name: racetrack
  num_agents: 2
  num_beams: 36
  observation_config:
    type: original
  progress_reward_scale: 1.0
  render_mode: null
  reset_config:
    type: cl_grid_static
  safety_mode: true
  timestep: 0.01
name: safety_first_racing
ppo:
  clip_param: 0.2
  entropy_coeff: 0.01
  gamma: 0.99
  kl_coeff: 0.2
  lambda_: 0.95
  lr: 5.0e-05
  normalize_actions: true
  value_function_clip_param: 10.0
  vf_loss_coeff: 1.0
sac: null
storage_path: ./models
tags:
- safety
- collision_avoidance
- ppo
training:
  checkpoint_interval: 1000
  eval_interval: 2000
  evaluation_episodes: 5
  num_cpus_per_worker: 1
  num_gpus: 1.0
  num_sgd_iter: 10
  num_workers: 4
  reward_function: SafetyProgressRewardEnv
  sgd_minibatch_size: 256
  timesteps_total: 3000000
  train_batch_size: 4000
