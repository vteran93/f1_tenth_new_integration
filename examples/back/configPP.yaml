# Configuración del entorno
environment:
  map: Spielberg
  num_agents: 2
  timestep: 0.01
  num_beams: 36
  integrator: rk4
  control_input: ["speed", "steering_angle"]
  observation_config:
    type: original
  reset_config:
    type: rl_random_static
  render_mode: human  # Solo necesario para evaluación y PurePursuit

# Configuración de PurePursuit
purepursuit:
  map_path: "../maps/Spielberg/Spielberg_raceline.csv"
  lookahead_distance: 1.0
  wheelbase: 0.33
  max_steer: 0.4
  max_speed: 4.0
  curvature_scale: 1.0
  max_steps: 10000  # Límite de pasos para PurePursuit

# Configuración de entrenamiento PPO (opcional)
ppo_training:
  total_timesteps: 20000
  save_every: 2000
