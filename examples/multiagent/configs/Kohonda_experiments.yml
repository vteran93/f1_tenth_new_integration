# ——— Anchors definitions ———
# This file defines the configuration for multiple experiments in a multi-agent reinforcement learning setup.
# This are the anchors used to avoid repetition in the YAML file.
# Anchors are used to define common configurations that can be reused across different experiments.
training: &training
  timesteps_total: 1_000_000
  eval_interval:    2000
  reward_function:  ProgressRewardEnv

evaluation: &evaluation
  episodes: 5

env: &env
  map:               oval_small
  num_agents:        2
  timestep:          0.01
  num_beams:         36
  integrator:        rk4
  control_input:     [speed, steering_angle]
  observation_config: { type: original }
  reset_config:       { type: cl_grid_static }
  render_mode:        null

ppo_params: &ppo_params
  gamma:            0.99
  lr:               0.00005
  train_batch_size: 4000
  environment:      { normalize_actions: true }

sac_params: &sac_params
  tau:                   0.005
  target_entropy:        auto
  alpha_lr:              0.0003
  environment:           { normalize_actions: true }
  replay_buffer_config:  { type: MultiAgentPrioritizedReplayBuffer }

# ——— List of experiments ———
experiments:
  
  - name: oval_small_PPO_KohondaNew_Shared_Policy
    storage_path: ../models
    training:
      <<: *training
      algorithm:     PPO
      reward_function:  KohondaMultiAgentF110Env
      shared_policy: true
    evaluation:
      <<: *evaluation
    env:
      <<: *env
    ppo_params:
      <<: *ppo_params
      lr: 0.0003
      entropy_coeff: 0.01
      clip_param: 0.2                # clipping de ratio en función objetivo :contentReference[oaicite:4]{index:4}
      kl_coeff: 0.0                  # coef KL si prefieres constricción explícit:
      vf_loss_coeff: 0.5             # pondera la pérdida del value function :contentReference:oaicite:5]{index=5}
      lambda_: 0.95 
  
  - name: oval_small_SAC_KohondaNew_Shared_Policy
    storage_path: ../models
    training:
      <<: *training
      algorithm:     SAC
      reward_function:  KohondaMultiAgentF110Env
      shared_policy: true
    evaluation:
      <<: *evaluation
    env:
      <<: *env
    sac_params:
      <<: *sac_params
      actor_lr: 0.0003
      critic_lr: 0.0003
      alpha_lr: 0.0003
      initial_alpha: 1.0
      tau: 0.005

  - name: oval_small_SAC_Kohonda_Individual_Policy
    storage_path: ../models
    training:
      <<: *training
      reward_function:  KohondaMultiAgentF110Env
      algorithm:     SAC
      shared_policy: false
    evaluation:
      <<: *evaluation
    env:
      <<: *env
    sac_params:
      <<: *sac_params
