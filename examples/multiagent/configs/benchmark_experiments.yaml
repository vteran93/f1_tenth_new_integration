# Configuración de experimento para pruebas de benchmark
# Este archivo incluye configuración específica para generar métricas compatibles con f1tenth_benchmarks

training: &training
  timesteps_total: 1_000_000  # Entrenamiento más corto para pruebas
  eval_interval: 1000
  reward_function: ProgressRewardEnv
  algorithm: PPO
  shared_policy: true

evaluation: &evaluation
  episodes: 10  # Más episodios para mejor estadística

env: &env
  map: oval_small
  num_agents: 1  # Un solo agente para simplificar análisis
  timestep: 0.01
  num_beams: 36
  integrator: rk4
  control_input: [speed, steering_angle]
  observation_config: { type: original }
  reset_config: { type: cl_grid_static }
  render_mode: null

ppo_params: &ppo_params
  gamma: 0.99
  lr: 0.00005
  train_batch_size: 2000
  environment: { normalize_actions: true }

sac_params: &sac_params
  tau: 0.005
  target_entropy: auto
  alpha_lr: 0.0003
  environment: { normalize_actions: true }
  replay_buffer_config: { type: MultiAgentPrioritizedReplayBuffer }

experiments:
  - name: benchmark_test_PPO
    storage_path: ../models_benchmark
    training:
      <<: *training
    evaluation:
      <<: *evaluation
    env:
      <<: *env
    ppo_params:
      <<: *ppo_params
      
  - name: benchmark_test_SAC
    storage_path: ../models_benchmark
    training:
      <<: *training
      algorithm: SAC
    evaluation:
      <<: *evaluation
    env:
      <<: *env
    sac_params:
      <<: *sac_params
